name: CI

on:
  push:
    # 'refactor/**', not 'refactor': a bare name matches that branch and nothing
    # under it, so every push to refactor/v0.2 ran no CI at all — which is how a
    # smoke test left asserting the schema-1 manifest layout stayed red, unseen,
    # for the length of a release cycle.
    branches: [main, 'refactor/**']
  pull_request:

# Third-party actions are pinned to a commit SHA, with the version in a comment.
# A tag is a movable label: whoever can push to actions/checkout can repoint v4
# at anything, and this workflow has a checkout of the repo and the runner's
# token. envup verifies the digest of every binary it downloads onto your
# machine; holding its own CI to a lower standard would be an odd place to stop.
# Dependabot bumps these (.github/dependabot.yml) and rewrites the comment.

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (shellcheck + bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell sources
        run: bash scripts/lint.sh

  unit:
    name: unit (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # zsh is a test dependency, not just a module: tests/unit/zshconfig.bats
      # starts real interactive shells to assert the slice order, PATH dedup and
      # conditional locale/EDITOR behaviour. Without zsh those tests skip, and a
      # silently skipped suite is the same as no suite.
      - name: Install bats + zsh
        run: sudo apt-get update && sudo apt-get install -y bats zsh
      - name: Run unit tests
        run: bats tests/unit
      - name: Fail if the zsh-config tests skipped
        run: |
          bats tests/unit/zshconfig.bats | tee /tmp/zsh.tap
          ! grep -q '# skip' /tmp/zsh.tap

  integration:
    name: integration (dry-run + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install bats + jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Run integration tests
        run: bats tests/integration

  no-root:
    name: no-root install (unprivileged container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      # The scenario envup 0.2 exists for: a server where you have an account
      # and nothing else. No sudo, no package manager, no writing outside $HOME.
      # Everything that ships as a static binary must still arrive (via the
      # github_release provider, into ~/.local/bin); everything that needs a
      # compiler must come back 'degraded' with its config linked — never
      # 'failed', and never a prompt or a hang.
      - name: install --profile standard as an unprivileged user
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 bash -eu -c '
            apt-get update -qq && apt-get install -y -qq git zsh curl ca-certificates >/dev/null
            useradd -m tester
            cp -a /src /home/tester/envup && chown -R tester /home/tester/envup
            su tester -c "
              set -eu
              cd /home/tester/envup
              ./envup install --profile standard      # exit 0 unless something truly broke
              ./envup status
              ./envup doctor
              test -x \$HOME/.local/bin/zoxide || { echo \"zoxide did not land in ~/.local/bin\"; exit 1; }
              test -L \$HOME/.zshrc              || { echo \"~/.zshrc was not linked\"; exit 1; }
            "
          '

  offline:
    name: offline install (no network egress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      # ENVUP_OFFLINE=1 must make every network step decline *immediately*.
      # The outer timeout is the actual assertion: the failure mode being
      # guarded against is not a wrong answer, it is a 900s hang on a machine
      # whose proxy silently blackholes connections.
      - name: install --profile minimal with ENVUP_OFFLINE=1
        env:
          ENVUP_OFFLINE: "1"
        run: |
          export HOME="$(mktemp -d)"
          timeout 180 ./envup install --profile minimal
          timeout 60  ./envup status
          # …and it declined rather than tried. 'offline:' is the decline
          # message; 'Cloning into' would be git having actually gone out.
          grep -rq 'offline:'     "$HOME/.local/state/envup/logs/"
          ! grep -rq 'Cloning into' "$HOME/.local/state/envup/logs/"

  old-bash:
    name: bash 4.2 (the declared floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # envup requires bash >= 4 and every other job here runs bash 5, so the
      # versions between the floor and the tested floor were never exercised.
      # centos:7 is bash 4.2.46 — the oldest bash envup claims to accept, and
      # the one on the RHEL 7 servers this is aimed at. --network none because
      # the image's repos are EOL and nothing here needs to fetch anything.
      - name: Read-only and dry-run commands on bash 4.2
        run: |
          docker run --rm -v "$PWD:/src:ro" --network none centos:7 \
            bash -c 'cp -r /src /work && cd /work && tests/integration/oldbash.sh'

  smoke-host:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # macOS ships bash 3.2; envup re-execs into Homebrew bash (>= 4). Install
      # it so that path is exercised in CI.
      - name: Install bash >= 4 (macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Smoke — git install -> status -> uninstall
        run: bash tests/integration/smoke.sh

  smoke-containers:
    name: smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # debian:11 is not a fourth flavour of Linux, it is the *old glibc* row.
        # It ships glibc 2.31, below the 2.34 that current prebuilt binaries are
        # built against — which is the failure mode envup exists to survive, and
        # the one every other image here hides: a binary installs perfectly and
        # then dies on every call with "version `GLIBC_2.34' not found". alpine
        # covers musl, fedora and arch are both newer than the runner. Without
        # this row nothing in CI runs on a machine older than the CI machine,
        # and old machines are the ones you cannot upgrade.
        image: [fedora:latest, archlinux:latest, alpine:latest, debian:11]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Run the smoke test inside each distro via docker (checkout stays on the
      # host, so we avoid node-in-container issues). Each distro installs bash +
      # git with its own package manager, then runs the smoke script.
      - name: Smoke in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e DEBIAN_FRONTEND=noninteractive \
            "${{ matrix.image }}" sh -c '
            set -e
            if command -v dnf >/dev/null 2>&1; then dnf install -y git bash >/dev/null;
            elif command -v pacman >/dev/null 2>&1; then pacman -Sy --noconfirm git bash >/dev/null;
            elif command -v apk >/dev/null 2>&1; then apk add --no-cache git bash >/dev/null;
            elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq >/dev/null && apt-get install -y -qq git bash >/dev/null;
            fi
            bash tests/integration/smoke.sh
          '
