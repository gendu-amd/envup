name: CI

on:
  push:
    # Keep refactor branches covered as well as main.
    branches: [main, 'refactor/**']
  pull_request:

# Pin third-party actions to immutable SHAs; Dependabot updates the pins.

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (shellcheck + bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell sources
        run: bash scripts/lint.sh

  unit:
    name: unit (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # release.bats verifies every released version has a real tag.
          fetch-depth: 0
      # These are test runtimes, not module dependencies: zsh exercises real
      # interactive startup and Lua parses the shipped nvim configuration.
      - name: Install test runtimes
        run: sudo apt-get update && sudo apt-get install -y bats zsh lua5.1 tmux
      # Ubuntu's package may be below the configuration's Nvim 0.10 floor.
      # Use the existing release provider without installing editor config.
      - name: Prepare Nvim test runtime
        run: |
          timeout 180 bash -u -c '
            export ENVUP_HOME="$PWD"
            export ENVUP_LOCAL_BIN="$RUNNER_TEMP/envup-test/bin"
            export ENVUP_LOCAL_OPT="$RUNNER_TEMP/envup-test/opt"
            source ./lib.sh || exit
            _engine_load nvim || exit
            # Match the existing compatibility route on an older runner libc.
            case "$ENVUP_LIBC" in glibc-*)
              version_ge "${ENVUP_LIBC#glibc-}" "$NVIM_RELEASE_GLIBC_MIN" || GH_TAG="$NVIM_LEGACY_TAG"
            esac
            provider_github_release || exit
            engine_verify || exit
            echo "$ENVUP_LOCAL_BIN" >> "$GITHUB_PATH"
          '
      - name: Run unit tests
        run: |
          set -o pipefail
          bash --version
          bats --version
          mkdir --version
          bats tests/unit | tee /tmp/unit.tap
          ! grep -q '# skip' /tmp/unit.tap

  integration:
    name: integration (dry-run + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install bats + jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Run integration tests
        run: bats tests/integration

  no-root:
    name: no-root install (unprivileged container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      # A server where you have an account and nothing else: no sudo, no package
      # manager, no writing outside $HOME.
      # Everything that ships as a static binary must still arrive (via the
      # github_release provider, into ~/.local/bin); everything that needs a
      # compiler must come back 'degraded' with its config linked — never
      # 'failed', and never a prompt or a hang.
      - name: install --profile standard as an unprivileged user
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 bash -eu -c '
            sed -i "s|archive.ubuntu.com|azure.archive.ubuntu.com|g; s|security.ubuntu.com|azure.archive.ubuntu.com|g" \
                /etc/apt/sources.list.d/ubuntu.sources
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                    -o Acquire::https::Timeout=30 update -qq
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                    -o Acquire::https::Timeout=30 install -y -qq \
                    git zsh curl ca-certificates >/dev/null
            useradd -m tester
            cp -a /src /home/tester/envup && chown -R tester /home/tester/envup
            su tester -c "
              set -eu
              cd /home/tester/envup
              ./envup install --profile standard      # exit 0 unless something truly broke
              ./envup status
              ./envup doctor
              test -x \$HOME/.local/bin/zoxide || { echo \"zoxide did not land in ~/.local/bin\"; exit 1; }
              test -L \$HOME/.zshrc              || { echo \"~/.zshrc was not linked\"; exit 1; }
            "
          '

  offline:
    name: offline install (no network egress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      # ENVUP_OFFLINE=1 must make every network step decline *immediately*.
      # The outer timeout is the actual assertion: the failure mode being
      # guarded against is not a wrong answer, it is a 900s hang on a machine
      # whose proxy silently blackholes connections.
      - name: install --profile minimal with ENVUP_OFFLINE=1
        env:
          ENVUP_OFFLINE: "1"
        run: |
          export HOME="$(mktemp -d)"
          timeout 180 ./envup install --profile minimal
          timeout 60  ./envup status
          # …and it declined rather than tried. 'offline:' is the decline
          # message; 'Cloning into' would be git having actually gone out.
          grep -rq 'offline:'     "$HOME/.local/state/envup/logs/"
          ! grep -rq 'Cloning into' "$HOME/.local/state/envup/logs/"

  old-bash:
    name: bash 4.2 (legacy CLI and Git lifecycle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # centos:7 is bash 4.2.46, used on RHEL 7 servers; this job does not
      # exercise the declared Bash 4.0 floor. --network none because
      # the image's repos are EOL and nothing here needs to fetch anything.
      - name: CLI and offline Git lifecycle on bash 4.2
        run: |
          docker run --rm -v "$PWD:/src:ro" --network none centos:7 \
            bash -c 'cp -r /src /work && cd /work && tests/integration/oldbash.sh'

  smoke-host:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # macOS ships bash 3.2; envup re-execs into Homebrew bash (>= 4). Install
      # it so that path is exercised in CI.
      - name: Install bash >= 4 (macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Smoke — configuration and runnable release
        env:
          ENVUP_SMOKE_RELEASE: "1"
        run: bash tests/integration/smoke.sh

  smoke-containers:
    name: smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # debian:11 is not a fourth flavour of Linux, it is the *old glibc* row.
        # It ships glibc 2.31, below the 2.34 that current prebuilt binaries are
        # built against — which is the failure mode envup exists to survive, and
        # the one every other image here hides: a binary installs perfectly and
        # then dies on every call with "version `GLIBC_2.34' not found". alpine
        # covers musl, fedora and arch are both newer than the runner. Without
        # this row nothing in CI runs on a machine older than the CI machine,
        # and old machines are the ones you cannot upgrade.
        image: [fedora:latest, archlinux:latest, alpine:latest, debian:11]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Run the smoke test inside each distro via docker (checkout stays on the
      # host, so we avoid node-in-container issues). Each distro installs bash +
      # git with its own package manager, then runs the smoke script.
      - name: Smoke in ${{ matrix.image }}
        run: |
          docker run --rm --cpus=2 -v "$PWD:/src:ro" -w /src -e DEBIAN_FRONTEND=noninteractive \
            -e ENVUP_SMOKE_RELEASE=1 \
            "${{ matrix.image }}" sh -c '
            set -e
            if command -v dnf >/dev/null 2>&1; then dnf install -y git bash curl ca-certificates tar gzip >/dev/null;
            elif command -v pacman >/dev/null 2>&1; then pacman -Sy --noconfirm git bash curl ca-certificates tar gzip >/dev/null;
            elif command -v apk >/dev/null 2>&1; then apk add --no-cache git bash curl ca-certificates tar gzip >/dev/null;
            elif command -v apt-get >/dev/null 2>&1; then
              # Bullseye security packages have moved off the active mirror.
              sed -i "s|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|" /etc/apt/sources.list
              apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq >/dev/null
              apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq git bash curl ca-certificates tar gzip >/dev/null
            fi
            bash tests/integration/smoke.sh
          '
