# envup tmux config

set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on

# Use zsh when available. tmux requires an absolute default-shell path.
run-shell 'command -v zsh >/dev/null 2>&1 && tmux set -g default-shell "$(command -v zsh)"'

# Old systems may not ship the tmux-256color terminfo entry.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 50000

# OSC 52 passes remote copies through tmux to the outer terminal.
set -s set-clipboard on
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# Status and persistent copy-mode indicator.
set -g status on
set -g status-position bottom
set -g status-style 'bg=#282c34 fg=#abb2bf'
set -g status-left-length 40
set -g status-left '#[fg=#282c34,bg=#e06c75,bold]#{?pane_in_mode, COPY ,}#[default]#[fg=#61afef,bold][#S] '
set -g status-right-length 100
set -g status-right '#[fg=#e5c07b]#{host} #[fg=#98c379]%H:%M #[fg=#61afef]%Y-%m-%d'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#282c34,bg=#61afef,bold] #I:#W '

# Pane, window, and project navigation.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r "<" swap-window -t -1
bind -r ">" swap-window -t +1
bind f run-shell -b '~/.local/bin/tmux-sessionizer --launch'

# Vi copy mode: prefix-v enters, v selects, y/Enter/C-c copy, i cancels.
setw -g mode-keys vi
bind v copy-mode \; display-message 'COPY: hjkl move | v select | y copy | i/q quit'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi y     send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi C-c   send -X copy-selection-and-cancel

# Prefer a usable native clipboard; otherwise the bindings above use OSC 52.
run-shell '                                                                   \
    c=;                                                                       \
    if command -v pbcopy >/dev/null 2>&1; then c="pbcopy";                    \
    elif command -v clip.exe >/dev/null 2>&1; then c="clip.exe";              \
    elif [ -n "${WAYLAND_DISPLAY:-}" ] && command -v wl-copy >/dev/null 2>&1; \
        then c="wl-copy";                                                     \
    elif [ -n "${DISPLAY:-}" ] && command -v xclip >/dev/null 2>&1;           \
        then c="xclip -selection clipboard";                                  \
    elif [ -n "${DISPLAY:-}" ] && command -v xsel >/dev/null 2>&1;            \
        then c="xsel --clipboard --input";                                    \
    fi;                                                                       \
    tmux set -g @envup-copy-cmd "$c";                                         \
    if [ -n "$c" ]; then                                                      \
        for k in y Enter C-c; do                                              \
            tmux bind -T copy-mode-vi "$k" send -X copy-pipe-and-cancel "$c"; \
        done;                                                                 \
    fi'

# A drag selects without copying. Double/triple click select word/line.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line
bind -T root DoubleClick1Pane \
    if -Ft= '#{mouse_any_flag}' 'send -M' \
        'copy-mode -t= ; send -X select-word'
bind -T root TripleClick1Pane \
    if -Ft= '#{mouse_any_flag}' 'send -M' \
        'copy-mode -t= ; send -X select-line'

# Plugins are vendored as git submodules and linked by envup.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Separate restore data by short hostname on shared HOME directories.
run-shell 'h=$(hostname 2>/dev/null | cut -d. -f1); [ -n "$h" ] && tmux set -g @resurrect-dir "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/resurrect/$h"'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# TPM must load after plugin options; host/private overrides load after TPM.
run '~/.tmux/plugins/tpm/tpm'
if-shell '[ -f ~/.tmux/host.conf ]' 'source-file ~/.tmux/host.conf'
if-shell '[ -f ~/.tmux.local ]' 'source-file ~/.tmux.local'
