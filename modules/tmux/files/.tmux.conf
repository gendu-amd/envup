# ============================================
# tmux Configuration  (managed by envup — symlinked to ~/.tmux.conf)
# ============================================

# ---------------------------
# General Settings
# ---------------------------
# Change prefix from Ctrl+b to Ctrl+a (easier to reach)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Use zsh for new panes/windows when it's installed, regardless of the system
# login shell (so tmux matches your interactive shell even on machines where
# chsh couldn't change the default). Falls back to the login shell otherwise.
#
# default-shell, not default-command. They look interchangeable and are not:
# tmux runs default-shell as a *login* shell, and a default-command through
# `sh -c` as a plain one. A non-login zsh skips /etc/profile, /etc/zprofile and
# ~/.zprofile — which costs nothing for as long as you start tmux from a login
# shell and the panes inherit its environment, and costs you `module`, conda and
# macOS's path_helper the moment something else starts the server: continuum's
# auto-start, a systemd user unit, `ssh host tmux ...`. envup's own zsh files are
# safe either way; .zshenv is read by every zsh, login or not.
#
# The value has to be an absolute path — tmux ignores a bare name and falls back
# to /bin/sh — and tmux does not expand $(...) in its own config, so the lookup
# goes through a shell. `run-shell`, not `run-shell -b`: without -b tmux waits
# for it, which is what puts the option in place before the first pane exists.
#
# One gap, and it takes macOS *and* reattach-to-user-namespace *and* a chsh that
# failed to reach it: tmux-sensible sets default-command on that combination
# when it finds it empty, and a default-command wins over this. It sets a login
# `$SHELL`, so only the "zsh even when the login shell isn't" half is lost.
run-shell 'command -v zsh >/dev/null 2>&1 && tmux set -g default-shell "$(command -v zsh)"'

# The TERM that programs inside a pane see.
#
# tmux-256color is the entry tmux itself ships, and the only one that describes
# what tmux can actually do: italics, and 256 colours without the screen-era
# workarounds. screen-256color is a lie we tell because it is everywhere.
#
# It is not everywhere, though. ncurses only added the entry in 6.0, so CentOS 7
# and anything else of that vintage does not have it — and naming a terminfo
# entry that is not installed leaves every pane with wrong colours and, worse,
# wrong keys (Home, End and the arrows stop working). So ask first. infocmp
# answers in a millisecond, and on the slim images that drop ncurses-bin
# entirely the command is missing, which lands on the safe answer by itself.
#
# One caveat, for the machine you ssh *to* from inside tmux: it inherits this
# TERM and may not know the entry either. If you have one of those, pin the old
# value for this host in modules/tmux/files/hosts/<host>.conf, which is sourced
# after everything here.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# Enable true color
set -ga terminal-overrides ",*256col*:Tc"

# Scrollback per pane.
#
# The number matches tmux-sensible's on purpose rather than by accident.
# sensible only raises the limit when it finds tmux's own default of 2000 still
# in place, so *any* number written here wins over the plugin — including a
# smaller one, which is the failure mode: the plugin is installed, the line
# looks deliberate, and you get less scrollback than either of them intended.
# A compile or a benchmark run scrolls past the old 10000 without trying.
set -g history-limit 50000

# ---------------------------
# Clipboard (OSC 52)
# ---------------------------
# Copy inside tmux on a server -> the clipboard of the machine you are sitting
# at, carried by the SSH connection you already have. No X11 forwarding, no
# root, no daemon, no second network path. On the servers we use it is the only
# clipboard route that works at all.
#
# 'on', not the default 'external': external lets tmux send its *own* copies to
# the terminal but silently drops OSC 52 arriving from an application, so a yank
# in nvim would go nowhere.
set -s set-clipboard on

# tmux only emits the sequence when terminfo advertises the Ms capability, and
# hardly any terminfo entry does. tmux ships an override for xterm* only; this
# adds everything else (screen*, tmux*, and whatever a locked-down box reports).
# A terminal that does not understand OSC 52 ignores it, so the wildcard is free.
#
# Requires the outer terminal to support it. Windows Terminal and VS Code /
# Cursor do — VS Code needs terminal.integrated.enableClipboardWrite. The legacy
# conhost PowerShell window does not. See docs/CLIPBOARD.md.
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Killing a session moves the client to another one instead of detaching it.
#
# The default made sense when a session was the whole of tmux. With `prefix f`
# there is normally another project open, and closing one of them should no more
# throw you back to the login shell than closing a window should quit the
# terminal. ('off' rather than 'no-detached' — that value wants tmux 3.2, and
# with nothing left to switch to both of them detach anyway.)
set -g detach-on-destroy off

# ---------------------------
# Status Bar
# ---------------------------
# Enable status bar
set -g status on
set -g status-position bottom

# Status bar colors
set -g status-style 'bg=#282c34 fg=#abb2bf'

# Left side: [session] window-list
set -g status-left-length 40
set -g status-left '#[fg=#61afef,bold][#S] '

# Right side: Host, Time
set -g status-right-length 100
set -g status-right '#[fg=#e5c07b]#{host} #[fg=#98c379]%H:%M #[fg=#61afef]%Y-%m-%d'

# Window status format
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#282c34,bg=#61afef,bold] #I:#W '

# ---------------------------
# Key Bindings
# ---------------------------
# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows land in the current directory too.
#
# Without -c, new-window uses the directory the *session* was created in, which
# is a different answer depending on how the session came about: the project
# root for one the sessionizer made, and wherever you happened to be standing
# for one you started by hand. Splits have taken -c since they were written;
# this is the same rule for the third way of making somewhere to type.
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap windows left/right (< > mirrors default { } for panes)
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Jump to a project: fzf over the project roots, then attach-or-create a session
# named after it.
#
# The indirection earns its keep. fzf needs a terminal and a key binding has
# none, so something has to open one — and *what* it opens depends on the tmux
# this machine is running: a popup over the current pane from 3.2, a throwaway
# window before that. `--launch` makes that call at keypress time, so upgrading
# tmux is enough on its own; you do not also have to remember this line.
bind f run-shell -b '~/.local/bin/tmux-sessionizer --launch'

# ---------------------------
# Copy Mode (Vi style)
# ---------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# The baseline, replaced below on a machine that has a real clipboard tool.
# copy-selection also reaches the system clipboard, via set-clipboard above.
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Prefer this machine's own clipboard tool over OSC 52.
#
# OSC 52 is the route to a machine you cannot install anything on. It is not the
# route to prefer when the real clipboard is sitting right here, because it
# needs the *terminal* to cooperate: iTerm2 ships it turned off, macOS's
# Terminal.app does not implement it at all, and both of them drop the sequence
# without a word — which looks exactly like tmux failing to copy. pbcopy has
# neither problem, nor the size cap.
#
# The probe order is the same one nvim already uses, deliberately:
# modules/nvim/files/lua/configs/clipboard.lua. Presence on PATH is not enough —
# xclip with no DISPLAY is an error message, not a clipboard. The two disagreeing
# is what this is fixing, so if you change one, change the other.
#
# The bindings are issued from in here rather than written above because the
# -no-clear commands did not exist before tmux 3.0. tmux does not check the -X
# argument when the key is *bound* — `bind` succeeds on 2.x and the key is then
# silently dead when you press it — so this has to be decided by version rather
# than attempted and caught.
#
# Letting go of a mouse drag copies but does not leave copy mode: tmux's own
# binding is copy-and-cancel, which throws away the selection along with the
# mode, so a drag that grabbed one line too few costs you the whole gesture
# instead of a nudge. That is what -no-clear buys, and on 2.x it is unavailable,
# so the selection is cleared there and the copy still happens.
run-shell '                                                                       \
    c=;                                                                           \
    if command -v pbcopy >/dev/null 2>&1; then c="pbcopy";                        \
    elif command -v clip.exe >/dev/null 2>&1; then c="clip.exe";                  \
    elif [ -n "${WAYLAND_DISPLAY:-}" ] && command -v wl-copy >/dev/null 2>&1;     \
        then c="wl-copy";                                                         \
    elif [ -n "${DISPLAY:-}" ] && command -v xclip >/dev/null 2>&1;               \
        then c="xclip -selection clipboard";                                      \
    elif [ -n "${DISPLAY:-}" ] && command -v xsel >/dev/null 2>&1;                \
        then c="xsel --clipboard --input";                                        \
    fi;                                                                           \
    case "$(tmux -V)" in *" "[3-9]*|*" "[1-9][0-9]*) nc=-no-clear;; *) nc=;; esac; \
    tmux set -g @envup-copy-cmd "$c";                                             \
    if [ -n "$c" ]; then                                                          \
        tmux bind -T copy-mode-vi y send -X copy-pipe-and-cancel "$c";            \
        tmux bind -T copy-mode-vi MouseDragEnd1Pane send -X "copy-pipe$nc" "$c";  \
    else                                                                          \
        tmux bind -T copy-mode-vi MouseDragEnd1Pane send -X "copy-selection$nc";  \
    fi'

# ---------------------------
# Plugins (TPM)
# ---------------------------
# Plugin directories live in ~/.tmux/plugins/ (managed by envup as symlinks
# into modules/tmux/files/plugins/, themselves git submodules of this repo).
#
# Once loaded:
#   prefix + I        install/update plugins   (auto-run on first source)
#   prefix + Ctrl-s   manual save  (tmux-resurrect)
#   prefix + Ctrl-r   manual restore
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-resurrect: also capture each pane's visible content + restore nvim sessions
set -g @resurrect-capture-pane-contents 'on'
# Needs something to write Session.vim — see lua/configs/session.lua in the nvim
# module. Without that this line is an empty promise: the strategy falls back to
# the original command whenever the file is absent, which was always.
set -g @resurrect-strategy-nvim 'session'

# One save directory per machine.
#
# The default is ~/.local/share/tmux/resurrect, which is fine until the home
# directory is shared over NFS: then every machine writes the same file and the
# last one to save wins. You log into the build box and it restores the layout
# you had on the GPU box.
#
# The path is expanded here, and the option is handed a finished absolute path.
# resurrect can expand $HOME, $HOSTNAME and ~ inside this option itself, and
# this line used to leave that to it — one round trip too many. Whether the
# literal string survives tmux's own quoting on the way through depends on the
# version, and on at least one it did not: the option came back as `\$HOME/...`,
# resurrect's sed rewrote the $HOME inside it and left the backslash behind, and
# every save from then on went to a directory literally named `\` in the home
# directory while the restore kept reading the real path and finding a
# month-old file. Nothing can mangle an expansion that has already happened.
#
# The short hostname rather than $HOSTNAME: that variable is the FQDN on a
# domain-joined machine and is usually unset in the server's environment
# anyway, and the short name is what envup keys ~/.tmux/host.conf by
# ($ENVUP_HOST). One machine, one name, everywhere.
#
# Nothing set at all when there is no hostname to be had — resurrect then uses
# its own default, which is a better answer than a directory named "".
run-shell 'h=$(hostname 2>/dev/null | cut -d. -f1); [ -n "$h" ] && tmux set -g @resurrect-dir "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/resurrect/$h"'

# tmux-continuum: auto-save every 5min + auto-restore on tmux server start.
#
# The interval is the worst case for how much layout an unplanned reboot costs
# you — 15 minutes was long enough to lose a morning's worth of window shuffling.
# A save is a few tmux queries and one small file, so 5 is not expensive.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# Initialize TPM (must be the last plugin-related line; loads everything
# declared above and applies each plugin's defaults).
run '~/.tmux/plugins/tpm/tpm'

# ---------------------------
# Per-machine overrides
# ---------------------------
# Two layers, both sourced AFTER TPM so either can override a plugin's defaults.
#
# 1. ~/.tmux/host.conf — IN the repo, committed. A symlink envup points at
#    modules/tmux/files/hosts/<hostname>.conf, so per-machine settings sync,
#    survive a rebuild, and stay separate from each other on a home directory
#    shared over NFS. tmux cannot expand $(hostname) in source-file, which is
#    why envup resolves the name and links to this one fixed path.
#
#      cp modules/tmux/files/hosts/example.conf.template \
#         modules/tmux/files/hosts/$(hostname -s).conf
#      envup install tmux
#
# 2. ~/.tmux.local — NOT in the repo. Genuinely private or throwaway settings.
#    Loaded last, so it wins.
#
#      echo 'set -g status-style "bg=#1e1e2e fg=#cdd6f4"' >> ~/.tmux.local
#      tmux source ~/.tmux.conf
if-shell '[ -f ~/.tmux/host.conf ]' 'source-file ~/.tmux/host.conf'
if-shell '[ -f ~/.tmux.local ]' 'source-file ~/.tmux.local'


