# envup — pinned upstream versions for the github_release provider.
#
#   <module>  <tag>          # anything after # is a comment
#
# A module listed here always gets that exact release; a module absent from the
# file gets whatever is latest at install time. Pin when you want several
# machines to agree — two servers set up a week apart otherwise end up on
# different builds, and the difference surfaces later as a mystery.
#
# Every module that can install from a GitHub release is pinned here, and
# `tests/unit/providers.bats` fails if a new one is not: a half-pinned fleet is
# the worst of both, because the machines that disagree are exactly the ones
# nobody thought about. Nothing bumps these for you — Dependabot cannot see this
# file (see .github/dependabot.yml), so a version moves when a person decides
# it should.
#
# To pin or re-pin: take the tag from `envup status` or the install log, or read
# it off the upstream releases page. It is upstream's spelling, verbatim —
# ripgrep and delta publish `15.2.0`, everything else `v15.2.0`; construct it
# from the version number and the download 404s. To unpin: delete the line, and
# the test will tell you to put it back.
#
# module    tag
